<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ふくたあつこ 自己紹介</title>
<meta name="description" content="歯科医師・保育士・2児の母 ふくたあつこの自己紹介ページです。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3fbf8;
    --mint: #bfe8da;
    --mint-soft: #dcf3eb;
    --mint-deep: #4fa58c;
    --peach: #fde3d6;
    --lemon: #fbf1c9;
    --lavender: #e6e1f5;
    --ink: #2f4f46;
    --ink-soft: #5d7a71;
    --white: #ffffff;
    --shadow: 0 12px 32px rgba(79, 165, 140, 0.16);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN",
      "BIZ UDPGothic", "Meiryo", sans-serif;
    font-weight: 500;
    font-size: 16px;
    line-height: 1.9;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .wrap {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px;
  }

  section {
    position: relative;
    padding: 72px 0;
    overflow: hidden;
  }

  /* ---------- やわらかい丸の飾り ---------- */
  .bubble {
    position: absolute;
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
  }

  .bubble.mint     { background: var(--mint); }
  .bubble.mint-s   { background: var(--mint-soft); }
  .bubble.peach    { background: var(--peach); }
  .bubble.lemon    { background: var(--lemon); }
  .bubble.lavender { background: var(--lavender); }

  section > .wrap,
  .hero > .wrap { position: relative; z-index: 1; }

  /* ---------- 見出し ---------- */
  .label {
    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: var(--mint-deep);
    background: var(--white);
    padding: 4px 16px;
    border-radius: 999px;
    margin-bottom: 14px;
  }

  h2 {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 24px;
  }

  .center { text-align: center; }

  /* ---------- はじめまして ---------- */
  .hero {
    position: relative;
    padding: 120px 0 72px;
    text-align: center;
    overflow: hidden;
  }

  .hello {
    font-size: 18px;
    font-weight: 700;
    color: var(--mint-deep);
    letter-spacing: 0.1em;
  }

  .hero h1 {
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 0.12em;
    line-height: 1.4;
    margin: 4px 0 18px;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    list-style: none;
    margin-bottom: 28px;
  }

  .tags li {
    background: var(--white);
    border-radius: 999px;
    padding: 4px 16px;
    font-size: 14px;
    font-weight: 700;
    box-shadow: 0 4px 12px rgba(79, 165, 140, 0.1);
  }

  .scroll-cue {
    display: block;
    width: 28px;
    height: 28px;
    margin: 36px auto 0;
    border-right: 3px solid var(--mint-deep);
    border-bottom: 3px solid var(--mint-deep);
    transform: rotate(45deg) scale(0.6);
    border-radius: 2px;
    opacity: 0.7;
  }

  /* ---------- カード ---------- */
  .card {
    background: var(--white);
    border-radius: 28px;
    padding: 28px 24px;
    box-shadow: var(--shadow);
  }

  /* ---------- わたしについて ---------- */
  .profile-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .profile-list li {
    position: relative;
    padding-left: 30px;
    font-size: 17px;
    line-height: 1.6;
  }

  .profile-list li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 5px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--mint);
  }

  .profile-list small {
    display: block;
    font-size: 14px;
    color: var(--ink-soft);
  }

  /* ---------- すきなこと ---------- */
  .likes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }

  .like {
    background: var(--white);
    border-radius: 28px;
    padding: 24px 8px 20px;
    text-align: center;
    box-shadow: var(--shadow);
  }

  .like .icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 12px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .like .icon svg { width: 38px; height: 38px; }

  .like.travel .icon { background: var(--mint-soft); }
  .like.food   .icon { background: var(--peach); }
  .like.summer .icon { background: var(--lemon); }

  .like p {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.5;
  }

  footer {
    text-align: center;
    padding: 32px 0 40px;
    font-size: 13px;
    color: var(--ink-soft);
  }

  /* ---------- スクロールでふわっと表示 ---------- */
  .js .reveal {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .js .reveal.is-visible {
    opacity: 1;
    transform: none;
  }

  /* ---------- 広い画面 ---------- */
  @media (min-width: 720px) {
    section { padding: 96px 0; }
    h2 { font-size: 32px; }
    .hero { padding: 160px 0 96px; }
    .hero h1 { font-size: 52px; }
    .card { padding: 40px; }
    .like .icon { width: 88px; height: 88px; }
    .like .icon svg { width: 44px; height: 44px; }
    .like p { font-size: 17px; }
  }

  @media (max-width: 360px) {
    .likes { gap: 8px; }
    .like p { font-size: 13px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .js .reveal { opacity: 1; transform: none; transition: none; }
  }
</style>
</head>
<body>

<!-- はじめまして -->
<header class="hero">
  <span class="bubble mint"     style="width:300px;height:300px;right:-120px;top:-110px"></span>
  <span class="bubble lemon"    style="width:140px;height:140px;left:-50px;top:220px"></span>
  <span class="bubble peach"    style="width:56px;height:56px;left:18%;top:40px"></span>
  <span class="bubble lavender" style="width:90px;height:90px;right:6%;bottom:30px"></span>
  <div class="wrap">
    <p class="hello">はじめまして！</p>
    <h1>ふくたあつこ</h1>
    <ul class="tags">
      <li>歯科医師</li>
      <li>保育士</li>
      <li>2児の母</li>
    </ul>
    <span class="scroll-cue" aria-hidden="true"></span>
  </div>
</header>

<main>

  <!-- わたしについて -->
  <section class="profile">
    <span class="bubble mint-s" style="width:220px;height:220px;left:-100px;top:20px"></span>
    <div class="wrap reveal">
      <span class="label">ABOUT</span>
      <h2>わたしについて</h2>
      <div class="card">
        <ul class="profile-list">
          <li>歯科医師・保育士</li>
          <li>あわ歯科こども歯科クリニック 副院長<small>夫とともに医院を経営しています</small></li>
          <li>2児の母</li>
        </ul>
      </div>
    </div>
  </section>

  <!-- すきなこと -->
  <section>
    <span class="bubble lemon" style="width:180px;height:180px;right:-70px;top:40px"></span>
    <div class="wrap reveal">
      <div class="center">
        <span class="label">FAVORITE</span>
        <h2>すきなこと</h2>
      </div>
      <div class="likes">
        <div class="like travel">
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#4fa58c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
          </div>
          <p>旅行</p>
        </div>
        <div class="like food">
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#d98b6a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg>
          </div>
          <p>美味しい<br>ものを<br>食べること</p>
        </div>
        <div class="like summer">
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#d9a520" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
          </div>
          <p>夏が<br>大好き！</p>
        </div>
      </div>
    </div>
  </section>

</main>

<footer>&copy; ふくたあつこ</footer>

<script>
  (function () {
    // スクロールしたらふわっと表示する
    if (!("IntersectionObserver" in window)) return;
    document.documentElement.classList.add("js");
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add("is-visible");
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });
    document.querySelectorAll(".reveal").forEach(function (el) { observer.observe(el); });
  })();
</script>
</body>
</html>
